# El esquema ahora lo gestiona Flyway (ver src/main/resources/db/migration).
# 'validate' solo verifica que el esquema resultante coincide con las
# entidades JPA, sin borrar ni recrear nada.
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://${EASY_STORE_DB_HOST}:${EASY_STORE_DB_PORT}/${EASY_STORE_DB_NAME}
spring.datasource.username=${EASY_STORE_DB_USER}
spring.datasource.password=${EASY_STORE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.time-zone=America/Bogota
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# data.sql ya no se usa (el seed se migró a Flyway V2__seed_roles_and_ghost_user.sql).
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# --- Flyway ---
# spring.flyway.enabled=true es el default; se deja explícito por claridad.
spring.flyway.enabled=true
# NOTA IMPORTANTE - migración de un entorno YA EXISTENTE (creado a mano, sin Flyway):
# si Flyway corre por primera vez contra una BD que ya tiene las tablas creadas
# manualmente (como el volumen de Docker usado durante el desarrollo de este
# proyecto), fallará porque no existe la tabla flyway_schema_history. Para
# datos de desarrollo/prueba, la forma correcta de aplicar esto es recrear el
# volumen desde cero:
#   docker compose down -v && docker compose up -d --build
# baseline-on-migrate queda como red de seguridad para el caso en que en el
# futuro haya que aplicar Flyway sobre una BD con datos reales que no se pueda
# recrear; el flujo principal de verificación sigue siendo el volumen limpio.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

easy.store.aws.s3.access.key=${EASY_STORE_AWS_S3_ACCESS_KEY}
easy.store.aws.s3.secret.access.key=${EASY_STORE_AWS_S3_SECRET_ACCESS_KEY}
easy.store.aws.s3.easy.store.bucket=${EASY_STORE_AWS_S3_EASY_STORE}
# Opcional: endpoint de un emulador de S3 (LocalStack) para desarrollo local. Vacio en produccion.
easy.store.aws.s3.endpoint=${EASY_STORE_AWS_S3_ENDPOINT:}

easy.store.ghost.user=${EASY_STORE_GHOST_USER}
easy.store.ghost.password=${EASY_STORE_GHOST_PASSWORD}

# Usuario admin por defecto (ver AdminBootstrap). Si no se definen estas
# variables, no se crea ningun admin por defecto y el arranque no falla.
easy.store.admin.user=${EASY_STORE_ADMIN_USER:}
easy.store.admin.password=${EASY_STORE_ADMIN_PASSWORD:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_APP_USERNAME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
