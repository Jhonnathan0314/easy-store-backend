services:
  db:
    image: mysql:8.0
    container_name: easy-store-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${EASY_STORE_DB_NAME}
      MYSQL_USER: ${EASY_STORE_DB_USER}
      MYSQL_PASSWORD: ${EASY_STORE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EASY_STORE_DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - easy-store-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${EASY_STORE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - easy-store-net

  localstack:
    image: localstack/localstack:3.8
    container_name: easy-store-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EASY_STORE_AWS_S3_EASY_STORE: ${EASY_STORE_AWS_S3_EASY_STORE}
    ports:
      - "4566:4566"
    volumes:
      - easy-store-localstack-data:/var/lib/localstack
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - easy-store-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easy-store-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      EASY_STORE_DB_HOST: db
      EASY_STORE_DB_PORT: 3306
      EASY_STORE_DB_NAME: ${EASY_STORE_DB_NAME}
      EASY_STORE_DB_USER: ${EASY_STORE_DB_USER}
      EASY_STORE_DB_PASSWORD: ${EASY_STORE_DB_PASSWORD}
      SECRET_JWT_KEY: ${SECRET_JWT_KEY}
      EASY_STORE_AWS_S3_ACCESS_KEY: ${EASY_STORE_AWS_S3_ACCESS_KEY}
      EASY_STORE_AWS_S3_SECRET_ACCESS_KEY: ${EASY_STORE_AWS_S3_SECRET_ACCESS_KEY}
      EASY_STORE_AWS_S3_EASY_STORE: ${EASY_STORE_AWS_S3_EASY_STORE}
      # Endpoint del emulador de S3 (LocalStack). En un despliegue real contra
      # AWS, simplemente no definas esta variable en tu .env y quedará vacía.
      EASY_STORE_AWS_S3_ENDPOINT: ${EASY_STORE_AWS_S3_ENDPOINT:-http://localstack:4566}
      EASY_STORE_GHOST_USER: ${EASY_STORE_GHOST_USER}
      EASY_STORE_GHOST_PASSWORD: ${EASY_STORE_GHOST_PASSWORD}
      EASY_STORE_ADMIN_USER: ${EASY_STORE_ADMIN_USER:-}
      EASY_STORE_ADMIN_PASSWORD: ${EASY_STORE_ADMIN_PASSWORD:-}
      EMAIL_APP_USERNAME: ${EMAIL_APP_USERNAME}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
    ports:
      - "8081:8080"
    networks:
      - easy-store-net

networks:
  easy-store-net:
    driver: bridge

volumes:
  easy-store-db-data:
  easy-store-localstack-data:
